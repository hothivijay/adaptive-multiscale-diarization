[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amsd"
version = "1.0.0"
description = "Context-adaptive temporal scale weighting for overlap-aware far-field speaker diarization"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Vijay Hothi" },
  { name = "Narendrasinh B. Gohil" },
]
dependencies = [
  "torch>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "soundfile>=0.12",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]
# The frozen front end. Needed only by scripts/02_extract_embeddings.py.
frontend = ["nemo_toolkit[asr]==2.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
